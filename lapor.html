<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report an Issue - UrbanPulse</title>
    <meta
      name="description"
      content="Report an infrastructure problem: pick the location on the map, choose a category and urgency, describe it, and attach an optional photo."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/map-page.css" />
    <link rel="stylesheet" href="css/report-page.css" />
  </head>
  <body>
    <div id="app-navbar"></div>
    <main>
      <div class="rp">
        <div class="rp-col">
          <header class="rp-head" id="rp-intro">
            <p class="mp-kicker">File a report</p>
            <h1>Put the problem on the map.</h1>
            <p class="rp-lede">
              Four short steps. Location comes first, because a report without
              coordinates cannot be saved. Reports in this build are simulated
              and stay in your browser.
            </p>
            <ol class="rp-meter" id="rpMeter" aria-label="Progress">
              <li data-k="loc"><span>Location</span></li>
              <li data-k="cat"><span>Type</span></li>
              <li data-k="det"><span>Details</span></li>
              <li data-k="img"><span>Photo</span><small>optional</small></li>
            </ol>
            <p class="rp-progress" id="rpCount" aria-live="polite">
              0 of 3 required steps complete
            </p>
          </header>
          <div id="rp-form"></div>
        </div>
        <div class="rp-mapcol">
          <div
            id="up-map-root"
            data-mode="report"
            data-form-mount="rp-form"
          ></div>
        </div>
      </div>
    </main>
    <div id="app-footer"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="js/shared/layout.js"></script>
    <script type="module" src="js/pages/main.js"></script>
    <script type="module" src="js/pages/lapor-page.js"></script>
  </body>
</html>
